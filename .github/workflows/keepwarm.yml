name: keep-warm
on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          if [ -z "${{ vars.BACKEND_URL }}" ]; then
            echo "BACKEND_URL repo variable not set — skipping."; exit 0
          fi
          curl -fsS --max-time 90 "${{ vars.BACKEND_URL }}/api/health" && echo " — ok"
