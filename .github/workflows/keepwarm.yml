name: keep-warm-and-health-alert
on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health (retries; job failure = GitHub alert email)
        run: |
          if [ -z "${{ vars.BACKEND_URL }}" ]; then
            echo "BACKEND_URL repo variable not set — skipping."; exit 0
          fi
          for attempt in 1 2 3; do
            if curl -fsS --max-time 60 "${{ vars.BACKEND_URL }}/api/health" | grep -q '"ok"'; then
              echo "attempt $attempt — ok"
              exit 0
            fi
            echo "attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 30
          done
          echo "backend unhealthy after 3 attempts — failing job to trigger GitHub's workflow-failure alert email"
          exit 1
